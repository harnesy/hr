# The automatic check of a pull request. It builds the check from the BASE branch and only reads the pull request's
# files: nothing from the pull request is ever run, and the job has no secrets and a read-only token.
name: check
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Base branch (the check's code)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - name: Pull request (files to read)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false
      - name: Check
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          cd base/tools/check
          go build -buildvcs=false -o "$RUNNER_TEMP/check" .
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/check" --dir pr --base base --author "$AUTHOR"
